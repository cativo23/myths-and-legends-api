name: CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop
      - main

# Auto-format on develop pushes
permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy

      - name: Lint with flake8
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: |
          black --check app

      - name: Apply auto-format on develop (skip on PRs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          black app
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          if [[ -n $(git status --porcelain) ]]; then
            git add app
            git commit -m "style: apply black formatting [ci skip]"
            git push
          fi

      - name: Type check with mypy
        run: |
          mypy app --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          POSTGRES_PASSWORD: test
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.TEST_FIRST_SUPERUSER_PASSWORD || 'ci-test-superuser-password' }}
        run: |
          pytest -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=68

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t myths-and-legends-api:${{ github.sha }} .

      - name: Run container health check
        env:
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          POSTGRES_PASSWORD: ci-test-postgres-password
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.TEST_FIRST_SUPERUSER_PASSWORD || 'ci-test-superuser-password' }}
        run: |
          docker run -d --name test-container -p 8080:8080 \
            -e SECRET_KEY="$SECRET_KEY" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e FIRST_SUPERUSER_PASSWORD="$FIRST_SUPERUSER_PASSWORD" \
            myths-and-legends-api:${{ github.sha }}
          sleep 10
          docker logs test-container
          docker stop test-container
          docker rm test-container
