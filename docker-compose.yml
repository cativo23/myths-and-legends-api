services:
  api:
    image: 'myth-api:latest'
    ports:
      - '${APP_PORT-8080}:80'
    volumes:
      - './:/code'
      - './requirements.txt:/code/requirements.txt'
      - './.env:/code/.env:ro'
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1001}
    networks:
      - myths
    command: uvicorn app.main:app --host 0.0.0.0 --port 80 --reload --reload-include '*.env' --reload-include '.env'

  db:
    image: postgres:15-alpine
    ports:
      - '${POSTGRES_FORWARD_PORT-5432}:5432'
    networks:
      - myths
    volumes:
      - app-db-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-myths}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-myths}
      - POSTGRES_DB=${POSTGRES_DB:-myths}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myths} -d ${POSTGRES_DB:-myths}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    networks:
      - myths
    ports:
      - '${PG_ADMIN_PORT-8081}:80'
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  mailhog:
    image: 'mailhog/mailhog:latest'
    ports:
      - '${FORWARD_MAILHOG_PORT:-1025}:1025'
      - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
    networks:
      - myths

networks:
  myths:
    driver: bridge

volumes:
  app-db-data:
  pgadmin-data: